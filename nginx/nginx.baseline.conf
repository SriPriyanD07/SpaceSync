user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status bytes_sent=$body_bytes_sent '
                            'upstream_addr="$upstream_addr" upstream_response_time="$upstream_response_time" '
                            'request_time="$request_time"';

    access_log /var/log/nginx/access.log loadbalanced;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Baseline: standard upstream without aggressive failover
    upstream spacesync_backend {
        server backend-1:5000;
        server backend-2:5000;
        server backend-3:5000;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Proxy-By "SpaceSync-Nginx-LB" always;

        location / {
            proxy_pass http://spacesync_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Served-By;
            proxy_pass_header X-Backend-Instance;

            # Baseline: Failover retries DISABLED to capture baseline failure behavior
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /lb-status {
            default_type application/json;
            return 200 '{"status":"ok","load_balancer":"nginx","port":8080,"upstream":"spacesync_backend","resilience":"baseline_no_retry"}';
        }
    }
}
