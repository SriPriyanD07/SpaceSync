user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Detailed access log capturing upstream instance IP, port, status, and response time
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status bytes_sent=$body_bytes_sent '
                            'upstream_addr="$upstream_addr" upstream_response_time="$upstream_response_time" '
                            'request_time="$request_time"';

    access_log /var/log/nginx/access.log loadbalanced;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream pool with passive health checks and fast eviction of dead instances
    upstream spacesync_backend {
        # Round-robin with passive failure eviction: mark server down for 5s after 1 connection failure
        server backend-1:5000 max_fails=1 fail_timeout=5s;
        server backend-2:5000 max_fails=1 fail_timeout=5s;
        server backend-3:5000 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Proxy-By "SpaceSync-Nginx-LB" always;

        location / {
            proxy_pass http://spacesync_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_header X-Served-By;
            proxy_pass_header X-Backend-Instance;

            # High-Availability Resilience Directives (DA3 Q1c)
            # Retries upstream connections transparently across remaining instances
            # Note: Excludes 'non_idempotent' to protect POST booking integrity
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Dedicated load balancer status endpoint
        location /lb-status {
            default_type application/json;
            return 200 '{"status":"ok","load_balancer":"nginx","port":8080,"upstream":"spacesync_backend","resilience":"active_failover_enabled","instances":["backend-1:5000","backend-2:5000","backend-3:5000"]}';
        }
    }
}
