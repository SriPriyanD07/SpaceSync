user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Detailed access log format capturing the upstream backend instance and response time
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status bytes_sent=$body_bytes_sent '
                            'upstream_addr="$upstream_addr" upstream_response_time="$upstream_response_time" '
                            'request_time="$request_time"';

    access_log /var/log/nginx/access.log loadbalanced;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream pool distributing traffic across three independent SpaceSync backend instances
    upstream spacesync_backend {
        # Round-robin distribution algorithm (default)
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
        server backend-3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Header identifying reverse proxy
        add_header X-Proxy-By "SpaceSync-Nginx-LB" always;

        location / {
            proxy_pass http://spacesync_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass upstream response headers including X-Served-By and X-Backend-Instance
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Backend-Instance;

            # High-availability failover: if an instance times out or returns error, retry next
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Dedicated load balancer status endpoint
        location /lb-status {
            default_type application/json;
            return 200 '{"status":"ok","load_balancer":"nginx","port":8080,"upstream":"spacesync_backend","instances":["backend-1:5000","backend-2:5000","backend-3:5000"]}';
        }
    }
}
