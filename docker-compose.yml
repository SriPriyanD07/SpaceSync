version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spacesync-postgres
    restart: always
    environment:
      POSTGRES_USER: spacesync_user
      POSTGRES_PASSWORD: spacesync_password
      POSTGRES_DB: spacesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacesync_user -d spacesync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
