services:
  # ==========================================
  # Backend Instance 1
  # ==========================================
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacesync-backend-1
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend-1
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-}
      - DB_POOL_MAX=${DB_POOL_MAX:-7}
      - ALLOW_EMBEDDED_DB=false
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spacesync-network

  # ==========================================
  # Backend Instance 2
  # ==========================================
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacesync-backend-2
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend-2
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-}
      - DB_POOL_MAX=${DB_POOL_MAX:-7}
      - ALLOW_EMBEDDED_DB=false
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spacesync-network

  # ==========================================
  # Backend Instance 3
  # ==========================================
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spacesync-backend-3
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - INSTANCE_ID=backend-3
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY:-}
      - DB_POOL_MAX=${DB_POOL_MAX:-7}
      - ALLOW_EMBEDDED_DB=false
      - CLIENT_URL=${CLIENT_URL:-http://localhost:8080}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spacesync-network

  # ==========================================
  # Nginx Load Balancer (Reverse Proxy)
  # ==========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: spacesync-nginx-lb
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-status > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - spacesync-network

networks:
  spacesync-network:
    name: spacesync-network
    driver: bridge
