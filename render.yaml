services:
  - type: web
    name: spacesync-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://space-sync-one.vercel.app
      - key: DATABASE_URL
        sync: false # Set via Render dashboard with managed Neon PostgreSQL connection string (sslmode=require)
